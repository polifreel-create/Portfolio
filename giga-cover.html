<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип обложки Гигасправки</title>
<meta name="robots" content="noindex">
<link rel="preload" href="assets/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/v2.css?v=85">
<style>
body{background:#EBEEF1;margin:0;font-family:var(--font);color:#0F1414}
.wrap{max-width:980px;margin:0 auto;padding:40px 24px 80px}
h1{font:500 28px/1.2 var(--font);letter-spacing:-.02em;margin:0 0 6px}
.sub{margin:0 0 24px;color:#525A5B;font-size:15px}
.row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.card{background:#fff;border-radius:32px;padding:12px;flex:1 1 560px}
.card.m{flex:0 0 340px}
.k{font:500 13px/1 var(--font);color:#959C9E;margin:4px 8px 10px;display:block}
.btn{margin-top:20px;height:44px;padding:0 20px;border:0;border-radius:999px;background:#0F1414;color:#fff;font:500 15px/1 var(--font);cursor:pointer}

/* ===== сама обложка ===== */
.gc{position:relative;aspect-ratio:900/493;border-radius:24px;overflow:hidden;background:#2a1a10}
.gc-st{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:0 0}
.gc-bg{position:absolute;inset:0;width:100%;height:100%}
.gc-scr{position:absolute;left:611px;top:257px;width:443px;height:684px;border-radius:52px 52px 0 0;overflow:hidden}
.gc-scr img{position:absolute;display:block}
.gc-boom{left:17px;top:183px;width:412px;height:184px}
.gc-lamp{left:17px;top:369px;width:412px;height:137px}
.gc-ext{position:absolute;left:19px;top:503px;width:406px;height:200px;background:rgb(21,21,22)}
.gc-dome{position:absolute;left:126px;top:454px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 50% 28%,#4A4A4A 0%,#363636 45%,#2A2A2A 100%)}
.gc-dome i{position:absolute;inset:0;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 50% 26%,#F4E7AE 0%,#E3CD86 42%,#CDB167 78%,#BC9E55 100%);
  box-shadow:0 0 70px 14px rgba(255,212,120,.38);transition:opacity 1.6s ease}
.gc-tab{left:0;top:579px;width:443px;height:105px}
.gc-orb{position:absolute;left:192px;top:590px;width:60px;height:60px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 0 rgba(120,255,170,0);transition:box-shadow .8s ease,transform .8s cubic-bezier(.34,1.56,.64,1)}

/* экран ассистента поверх «Моего дома» — как в анимации из кейса */
.gc-as{position:absolute;z-index:3;left:0;top:50px;right:0;bottom:0;background:#121212;opacity:0;transition:opacity .6s ease}
.gc-as .gl{position:absolute;left:-20%;right:-20%;bottom:-10%;height:90%;opacity:0;transition:opacity 1s ease;
  background:radial-gradient(60% 55% at 50% 100%,rgba(215,115,25,.7),rgba(150,70,10,.22) 55%,transparent 75%)}
.gc-as .gl.t{background:radial-gradient(60% 55% at 50% 100%,rgba(40,175,165,.7),rgba(20,110,110,.24) 55%,transparent 75%)}
.gc-gear{position:absolute;right:26px;top:40px;width:22px;height:22px;color:rgba(255,255,255,.4)}
.gc-tx{position:absolute;left:26px;right:26px;top:96px;display:grid;font-size:19px;line-height:1.3;color:#EDEDED}
.gc-tx em{grid-area:1/1;font-style:normal;transition:opacity .45s ease}
.gc-tx .t2{opacity:0;background:linear-gradient(90deg,#EDEDED 0%,#EDEDED 35%,rgba(237,237,237,.3) 50%,#EDEDED 65%,#EDEDED 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.gc-btn{position:absolute;top:520px;width:50px;height:50px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);display:grid;place-items:center;color:rgba(255,255,255,.55)}
.gc-btn.l{left:36px}.gc-btn.r{right:36px}
.gc-cv{position:absolute;left:50%;top:545px;width:150px;height:150px;margin:-75px 0 0 -75px}
.gc-home{position:absolute;left:50%;bottom:40px;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:rgba(255,255,255,.75)}
.gc.as .gc-as{opacity:1}
.gc.or .gl.o{opacity:1}
.gc.te .gl.t{opacity:1}
.gc.chk .gc-tx .t1{opacity:0}
.gc.chk .gc-tx .t2{opacity:1;animation:gcShine 1.8s linear infinite}
@keyframes gcShine{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.gc *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Обложка Гигасправки — прототип</h1>
  <p class="sub">Укороченная анимация из кейса: «Мой дом» → оранжевый, затем голубой огонёк → «Не вижу лампочку» → «Проверяю состояние устройства». Цикл 8 секунд.</p>
  <div class="row">
    <div class="card"><span class="k">Десктоп · как в карточке кейса</span><div class="gc" data-gc></div></div>
    <div class="card m"><span class="k">Телефон</span><div class="gc" data-gc></div></div>
  </div>
  <button class="btn" id="replay" type="button">Проиграть сначала</button>
</div>

<template id="gcT">
  <div class="gc-st">
    <img class="gc-bg" src="assets/img/giga/cover-v3/bg.webp" alt="">
    <div class="gc-scr">
      <img class="gc-boom" src="assets/img/giga/cover-v3/boom.webp" alt="">
      <i class="gc-ext"></i>
      <img class="gc-lamp" src="assets/img/giga/cover-v3/lamp.webp" alt="">
      <div class="gc-dome"><i></i></div>
      <img class="gc-tab" src="assets/img/giga/cover-v3/tab.webp" alt="">
      <div class="gc-as">
        <i class="gl o"></i><i class="gl t"></i>
        <svg class="gc-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
        <div class="gc-tx"><em class="t1"></em><em class="t2">Проверяю состояние устройства.</em></div>
        <span class="gc-btn l"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        <span class="gc-btn r"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <canvas class="gc-cv" width="300" height="300"></canvas>
        <i class="gc-home"></i>
      </div>
    </div>
  </div>
</template>

<script>
(function(){
  var T=document.getElementById('gcT').innerHTML,all=[];
  /* точки сферы (как в анимации ассистента): равномерно по поверхности */
  var N=900,P=[];for(var i=0;i<N;i++){var y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;P.push([Math.cos(a)*r,y,Math.sin(a)*r,Math.random()*2-1,Math.random()*2-1,Math.random()*2-1])}
  function orb(cv){var c=cv.getContext('2d'),st={mix:0,col:0,t0:performance.now()};
    function draw(now){if(!cv.isConnected)return;var t=(now-st.t0)/1000,R=66,cx=150,cy=150,rot=t*.6,k=st.mix,e=k*k*(3-2*k);
      c.clearRect(0,0,300,300);
      var r1=[226,150,60],r2=[120,225,210],cc=r1.map(function(v,j){return Math.round(v+(r2[j]-v)*st.col)});
      for(var i=0;i<N;i++){var p=P[i],x=p[0]*Math.cos(rot)-p[2]*Math.sin(rot),z=p[0]*Math.sin(rot)+p[2]*Math.cos(rot),y=p[1];
        /* до сборки — облако частиц, после — сфера */
        var sx=x*(e)+p[3]*(1-e)*.9,sy=y*(e)+p[4]*(1-e)*1.1,sz=z*e+p[5]*(1-e);
        var al=(.35+.65*((sz+1)/2))*(.45+.55*e)*st.vis;
        c.fillStyle='rgba('+cc+','+al.toFixed(3)+')';c.fillRect(cx+sx*R-1,cy+sy*R-1,2,2)}
      requestAnimationFrame(draw)}
    st.vis=0;requestAnimationFrame(draw);return st}
  document.querySelectorAll('[data-gc]').forEach(function(g){
    g.innerHTML=T;g.setAttribute('role','img');g.setAttribute('aria-label','Приложение «Мой дом»: пользователь говорит ассистенту «Не вижу лампочку», ассистент проверяет состояние устройства');
    var st=g.querySelector('.gc-st');
    function fit(){var s=Math.max(g.clientWidth/1672,g.clientHeight/941);st.style.transform='scale('+s+') translate(-50%,-50%)'}
    fit();new ResizeObserver(fit).observe(g);
    all.push({g:g,o:orb(g.querySelector('.gc-cv')),t1:g.querySelector('.t1')})});
  function tween(f,from,to,ms){var t0=performance.now();(function s(n){var k=Math.min(1,(n-t0)/ms);all.forEach(function(x){f(x,from+(to-from)*k)});if(k<1)requestAnimationFrame(s)})(t0)}
  var timers=[];function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function cls(c){all.forEach(function(x){x.g.className='gc '+c})}
  function type(txt,ms){for(var i=0;i<=txt.length;i++)(function(i){at(ms+i*55,function(){all.forEach(function(x){x.t1.textContent=txt.slice(0,i)})})})(i)}
  function run(){timers.forEach(clearTimeout);timers=[];
    cls('');all.forEach(function(x){x.t1.textContent='';x.o.mix=0;x.o.col=0;x.o.vis=0});
    at(1400,function(){cls('as or');tween(function(x,v){x.o.vis=v},0,1,500)});          /* затемнение, оранжевые частицы */
    at(1700,function(){tween(function(x,v){x.o.mix=v},0,1,900)});                       /* частицы собираются в сферу */
    at(2600,function(){cls('as te');tween(function(x,v){x.o.col=v},0,1,700)});          /* оранжевый → голубой */
    type('Не вижу лампочку',2800);
    at(4300,function(){cls('as te chk')});                                             /* «Проверяю состояние устройства» */
    at(6800,function(){cls('');tween(function(x,v){x.o.vis=v},1,0,500)});                /* обратно на «Мой дом» */
    at(8000,run)}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){all.forEach(function(x){x.o.mix=1;x.o.col=1;x.o.vis=1;x.t1.textContent='Не вижу лампочку'});cls('as te')}else run();
  document.getElementById('replay').onclick=run;
})();
</script>
</body>
</html>
